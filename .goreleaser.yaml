version: 2

project_name: hypermesh-host

builds:
  - id: hypermesh-host
    main: ./cmd/hypermesh-host
    binary: hypermesh-host
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: hypermesh-host
    ids:
      - hypermesh-host
    formats: [tar.gz]
    name_template: "hypermesh-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
