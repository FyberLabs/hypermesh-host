name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# one sequence across channels; a host switching channel only moves to
# a strictly newer build. Every test and prod publish uses this group.
# cancel-in-progress is false, so a run already uploading is not
# cancelled. queue: max keeps every pending run. actionlint 1.7.12's
# schema does not list that key; .github/actionlint.yaml ignores the
# exact error on release workflows. publish-agent.sh leases
# locks/release-publish, the one blob both publishers may write and
# lease outside their channel, and waits until it holds that lease.
# max+1 is computed only inside the job.
concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max

# CI stays contents: read. Only the release job publishes.
permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: [self-hosted, linux, x64]
    # GitHub Free on this private repo has no deployment environments,
    # so this job uses repository variables. Infra #143 moves the
    # publisher to ref-based federated credentials:
    #   test: repo:FyberLabs/hypermesh-host:ref:refs/heads/main
    #   prod: repo:FyberLabs/hypermesh-host:ref:refs/tags/v*
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Azure config dir
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/az" >> "$GITHUB_ENV"

      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # The flag checker validates commands against azure-cli 2.90.0.
      # An older CLI on this runner is a different flag set.
      - name: Require azure-cli 2.90.0
        run: |
          set -euo pipefail
          ver=$(az version | python3 -c 'import json,sys; print(json.load(sys.stdin)["azure-cli"])')
          AZ_VER="$ver" python3 -c 'import os,sys; p=[int(x) for x in os.environ["AZ_VER"].split(".")[:3]]; p += [0]*(3-len(p)); sys.exit(0 if tuple(p)>=(2,90,0) else 1)' || {
            echo "hypermesh release: az ${ver} is older than 2.90.0" >&2
            exit 1
          }

      # test only for refs/heads/main. prod only for refs/tags/v* whose
      # commit is an ancestor of origin/main. workflow_dispatch from
      # any other ref fails here, before login.
      - name: Require a publishable ref
        run: |
          set -euo pipefail
          # shellcheck source=packaging/release/layout.sh
          source packaging/release/layout.sh
          channel=$(channel_for_ref "$GITHUB_REF") || exit 1
          if [ "$channel" = prod ]; then
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "hypermesh release: ${GITHUB_REF} is not an ancestor of origin/main" >&2
              exit 1
            fi
          fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_ENV"

      - name: Isolate Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

      - name: Set up Go
        # actions/setup-go v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      # Two repo variables, not one shared client id and not an environment.
      # Spellings are hypermesh_host_release_next_steps in infra #143.
      # Test output is hypermesh_host_test_client_id.
      # Prod output is hypermesh_host_prod_client_id.
      - name: Azure login (test)
        if: env.channel == 'test'
        # azure/login v3.1.0
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.HYPERMESH_HOST_RELEASE_TEST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Azure login (prod)
        if: env.channel == 'prod'
        # azure/login v3.1.0
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.HYPERMESH_HOST_RELEASE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # az storage blob tag set is not in azure-cli. Pin the preview
      # extension before the test publisher tags superseded=true.
      # Dynamic install is off so a missing pin fails instead of prompting.
      - name: Install storage blob tag extension
        if: env.channel == 'test'
        run: |
          set -euo pipefail
          az extension add --name storage-blob-preview --version 1.0.0b3 --yes
          az config set extension.use_dynamic_install=no

      - name: Publish signed agent
        env:
          channel: ${{ env.channel }}
          GH_TOKEN: ${{ github.token }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          HYPERMESH_RELEASE_KV_NAME: ${{ vars.HYPERMESH_RELEASE_KV_NAME || 'kv-fyber-hmhost' }}
          HYPERMESH_RELEASE_GPG_KEY_SECRET: ${{ vars.HYPERMESH_RELEASE_GPG_KEY_SECRET || 'hypermesh-host-release-gpg-private-key' }}
          HYPERMESH_RELEASE_GPG_PASSPHRASE_SECRET: ${{ vars.HYPERMESH_RELEASE_GPG_PASSPHRASE_SECRET || 'hypermesh-host-release-gpg-passphrase' }}
        run: |
          set -euo pipefail
          case "$channel" in
            test|prod) ;;
            *)
              echo "hypermesh release: refusing to publish without a channel from the ref guard" >&2
              exit 1
              ;;
          esac
          packaging/release/publish-agent.sh "$channel"

      - name: Wipe signing material and log out
        if: always()
        run: |
          set +x
          set -euo pipefail
          if [ -n "${GNUPGHOME:-}" ] && [ -d "${GNUPGHOME}" ]; then
            gpgconf --kill all || true
            if command -v shred >/dev/null 2>&1; then
              find "$GNUPGHOME" -type f -exec shred -u {} + || true
            fi
            rm -rf "$GNUPGHOME"
          fi
          gpgconf --kill all || true
          az logout || true
          rm -rf "${AZURE_CONFIG_DIR:-}"
