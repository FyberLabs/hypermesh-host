name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      test_only:
        description: Publish only the signed test channel from main; skip production promotion
        type: boolean
        default: false
      expected_source_sha:
        description: Exact approved main-history commit to publish for a test-only dispatch
        type: string
        default: ""

# one sequence across channels; a host switching channel only moves to
# a strictly newer build. Every test and prod publish uses this group.
# cancel-in-progress is false, so a run already uploading is not
# cancelled. queue: max keeps every pending run. actionlint 1.7.12's
# schema does not list that key; .github/actionlint.yaml ignores the
# exact error on release workflows. publish-agent.sh leases
# locks/release-publish, the one blob both publishers may write and
# lease outside their channel, and waits until it holds that lease.
# max+1 is computed only inside the job.
concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max

# CI stays contents: read. Only the release job publishes.
permissions:
  contents: read

jobs:
  release:
    name: release
    # Explicit test-only builds use the trusted main-only debrunner group.
    # Default main/tag runner routing stays unchanged; no public PR signing job.
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.test_only && '["self-hosted","linux","x64","debrunner"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    # This job uses repository variables. It does not use a GitHub
    # Environment. Federated credentials are ref-based:
    #   test: repo:hyperme-sh/hypermesh-host:ref:refs/heads/main
    #   prod: repo:hyperme-sh/hypermesh-host:ref:refs/tags/v*
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - name: Azure config dir
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/az" >> "$GITHUB_ENV"

      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Historical sources may predate the cleanup fix; retain the workflow copy.
      - name: Preserve workflow cleanup
        run: install -m 0700 packaging/release/cleanup.sh "$RUNNER_TEMP/release-cleanup.sh"

      - name: Select approved test source
        env:
          HYPERMESH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
          EXPECTED_TEST_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [ "$HYPERMESH_TEST_ONLY" = true ]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || ! "$EXPECTED_TEST_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Test-only publication requires main and an exact approved source SHA' >&2
              exit 1
            fi
            git merge-base --is-ancestor "$EXPECTED_TEST_SOURCE_SHA" "$GITHUB_SHA" || {
              echo 'Approved test source is not in this main history' >&2
              exit 1
            }
            git checkout --detach "$EXPECTED_TEST_SOURCE_SHA"
          fi
          printf 'RELEASE_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # GITHUB_TOKEN cannot create historical tags whose workflows differ
      # from main. Only explicit test-only dispatches use this scoped App.
      - name: Require test release App configuration
        env:
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
          TEST_RELEASE_APP_ID: ${{ vars.HYPERMESH_TEST_RELEASE_APP_ID }}
          TEST_RELEASE_APP_KEY_CONFIGURED: ${{ secrets.HYPERMESH_TEST_RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$TEST_ONLY" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
              echo 'Test release App is restricted to explicit main test-only dispatches' >&2
              exit 1
            fi
            if [ -z "$TEST_RELEASE_APP_ID" ] || [ "$TEST_RELEASE_APP_KEY_CONFIGURED" != true ]; then
              echo 'Configure HYPERMESH_TEST_RELEASE_APP_ID and HYPERMESH_TEST_RELEASE_APP_PRIVATE_KEY before test-only publication' >&2
              exit 1
            fi
          fi

      - name: Create scoped test release token
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test_only
        id: test-release-token
        # actions/create-github-app-token v3, automatically revoked in post.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.HYPERMESH_TEST_RELEASE_APP_ID }}
          private-key: ${{ secrets.HYPERMESH_TEST_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: false

      - name: Install isolated Azure CLI
        if: github.event_name == 'workflow_dispatch' && inputs.test_only
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/azure-cli-2.90.0"
          python3 -m pip install --target "$lib" 'azure-cli==2.90.0'
          bindir="$RUNNER_TEMP/az-bin"
          mkdir -p "$bindir"
          # shellcheck disable=SC2016
          {
            printf '%s\n' '#!/bin/sh'
            printf '%s\n' 'export PYTHONPATH="${AZ_CLI_LIB}${PYTHONPATH:+:$PYTHONPATH}"'
            printf '%s\n' 'exec python3 -m azure.cli "$@"'
          } > "$bindir/az"
          chmod 0755 "$bindir/az"
          printf 'AZ_CLI_LIB=%s\n' "$lib" >> "$GITHUB_ENV"
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"

      # The flag checker validates commands against azure-cli 2.90.0.
      # An older CLI is a different flag set.
      - name: Require azure-cli 2.90.0
        run: |
          set -euo pipefail
          ver=$(az version | python3 -c 'import json,sys; print(json.load(sys.stdin)["azure-cli"])')
          AZ_VER="$ver" python3 -c 'import os,sys; p=[int(x) for x in os.environ["AZ_VER"].split(".")[:3]]; p += [0]*(3-len(p)); sys.exit(0 if tuple(p)>=(2,90,0) else 1)' || {
            echo "hypermesh release: az ${ver} is older than 2.90.0" >&2
            exit 1
          }

      # test only for refs/heads/main. prod only for refs/tags/v* whose
      # commit is an ancestor of origin/main. workflow_dispatch from
      # any other ref fails here, before login.
      - name: Require a publishable ref
        env:
          HYPERMESH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
          EXPECTED_TEST_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          # shellcheck source=packaging/release/layout.sh
          source packaging/release/layout.sh
          channel=$(channel_for_ref "$GITHUB_REF") || exit 1
          require_test_only_source "$HYPERMESH_TEST_ONLY" "$GITHUB_REF" "$RELEASE_SOURCE_SHA" "$EXPECTED_TEST_SOURCE_SHA" || exit 1
          if [ "$channel" = prod ]; then
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "hypermesh release: ${GITHUB_REF} is not an ancestor of origin/main" >&2
              exit 1
            fi
          fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_ENV"

      - name: Isolate Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

      - name: Set up Go
        # actions/setup-go v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      # Two repo variables, not one shared client id and not an environment.
      # Test client id: repository variable HYPERMESH_HOST_RELEASE_TEST_CLIENT_ID.
      # Prod client id: repository variable HYPERMESH_HOST_RELEASE_PROD_CLIENT_ID.
      - name: Azure login (test)
        if: env.channel == 'test'
        # azure/login v3.1.0
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.HYPERMESH_HOST_RELEASE_TEST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Azure login (prod)
        if: env.channel == 'prod'
        # azure/login v3.1.0
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.HYPERMESH_HOST_RELEASE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # az storage blob tag set is not in azure-cli. Pin the preview
      # extension before the test publisher tags superseded=true.
      # Dynamic install is off so a missing pin fails instead of prompting.
      - name: Install storage blob tag extension
        if: env.channel == 'test'
        run: |
          set -euo pipefail
          az extension add --name storage-blob-preview --version 1.0.0b3 --yes
          az config set extension.use_dynamic_install=no

      - name: Publish signed agent
        env:
          channel: ${{ env.channel }}
          # Do not fall back to GITHUB_TOKEN if App token creation failed.
          GH_TOKEN: ${{ github.token }}
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
          TEST_RELEASE_TOKEN: ${{ steps.test-release-token.outputs.token }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          HYPERMESH_RELEASE_KV_NAME: ${{ vars.HYPERMESH_RELEASE_KV_NAME || 'kv-fyber-hmhost' }}
          HYPERMESH_RELEASE_GPG_KEY_SECRET: ${{ vars.HYPERMESH_RELEASE_GPG_KEY_SECRET || 'hypermesh-host-release-gpg-private-key' }}
          HYPERMESH_RELEASE_GPG_PASSPHRASE_SECRET: ${{ vars.HYPERMESH_RELEASE_GPG_PASSPHRASE_SECRET || 'hypermesh-host-release-gpg-passphrase' }}
        run: |
          set -euo pipefail
          case "$channel" in
            test|prod) ;;
            *)
              echo "hypermesh release: refusing to publish without a channel from the ref guard" >&2
              exit 1
              ;;
          esac
          if [ "$TEST_ONLY" = true ]; then
            if [ "$channel" != test ]; then
              echo 'Test release App cannot publish a production channel' >&2
              exit 1
            fi
            if [ -z "$TEST_RELEASE_TOKEN" ]; then
              echo 'Missing scoped test release token; refusing publication' >&2
              exit 1
            fi
            export GH_TOKEN="$TEST_RELEASE_TOKEN"
          fi
          GITHUB_SHA="$RELEASE_SOURCE_SHA" packaging/release/publish-agent.sh "$channel"

      - name: Wipe signing material and log out
        if: always()
        run: bash "$RUNNER_TEMP/release-cleanup.sh"

      - name: Automatically release successful main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HYPERMESH_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
        run: python3 packaging/release/promote-main.py
