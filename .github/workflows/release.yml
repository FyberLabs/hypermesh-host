name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# one sequence across channels; a host switching channel only moves to
# a strictly newer build. Every test and prod publish uses this group.
# cancel-in-progress is false, so a run already uploading is not
# cancelled. actionlint 1.7.12 rejects the concurrency property that
# would keep more than one pending run, so this file does not set
# that property. publish-agent.sh also leases locks/publish and waits
# until it holds that lease. max+1 is computed only inside the job.
concurrency:
  group: release-publish
  cancel-in-progress: false

# CI stays contents: read. Only the release job publishes.
permissions:
  contents: read

jobs:
  release:
    name: release-${{ github.ref_type == 'tag' && 'prod' || 'test' }}
    runs-on: [self-hosted, linux, x64]
    # Environment release gates this job, including the prod path.
    # Deployment branches (main plus v* tags) and the maintainer-only
    # v* tag ruleset are declared in a separate infra pull request.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Azure config dir
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/az" >> "$GITHUB_ENV"

      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # Prod only. A tag that is not reachable from origin/main fails.
      - name: Require tag commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Go
        # actions/setup-go v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Azure login
        # azure/login v2
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Publish signed agent
        env:
          GH_TOKEN: ${{ github.token }}
          HYPERMESH_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.HYPERMESH_RELEASE_GPG_PRIVATE_KEY }}
          HYPERMESH_RELEASE_GPG_PASSPHRASE: ${{ secrets.HYPERMESH_RELEASE_GPG_PASSPHRASE }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || secrets.AZURE_STORAGE_CONTAINER }}
        run: packaging/release/publish-agent.sh ${{ github.ref_type == 'tag' && 'prod' || 'test' }}

      - name: Azure logout
        if: always()
        run: |
          az logout || true
          rm -rf "${AZURE_CONFIG_DIR:-}"
