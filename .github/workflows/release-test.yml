name: Release test channel

on:
  push:
    branches:
      - main

# CI stays contents: read. Only this job can move the rolling test tag.
permissions:
  contents: read

jobs:
  release:
    name: release-test
    runs-on: [self-hosted, linux, x64]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Publish signed test build
        env:
          GH_TOKEN: ${{ github.token }}
          HYPERMESH_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.HYPERMESH_RELEASE_GPG_PRIVATE_KEY }}
          HYPERMESH_RELEASE_GPG_PASSPHRASE: ${{ secrets.HYPERMESH_RELEASE_GPG_PASSPHRASE }}
        run: packaging/release/publish-agent.sh test
