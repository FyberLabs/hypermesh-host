name: Release test channel

on:
  push:
    branches:
      - main

# One test publish at a time. Do not cancel a publish that is already
# uploading; the channel pointer moves only after that run verifies.
concurrency:
  group: release-test
  cancel-in-progress: false

# CI stays contents: read. Only the release job publishes.
permissions:
  contents: read

jobs:
  release:
    name: release-test
    runs-on: [self-hosted, linux, x64]
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ runner.temp }}/az
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        # actions/setup-go v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Azure login
        # azure/login v2
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Publish signed test build
        env:
          GH_TOKEN: ${{ github.token }}
          HYPERMESH_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.HYPERMESH_RELEASE_GPG_PRIVATE_KEY }}
          HYPERMESH_RELEASE_GPG_PASSPHRASE: ${{ secrets.HYPERMESH_RELEASE_GPG_PASSPHRASE }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || secrets.AZURE_STORAGE_CONTAINER }}
        run: packaging/release/publish-agent.sh test

      - name: Azure logout
        if: always()
        run: |
          az logout || true
          rm -rf "${AZURE_CONFIG_DIR:-}"
