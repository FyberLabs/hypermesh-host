# actionlint 1.7.12 rejects concurrency.queue. GitHub Actions accepts
# queue: max, which keeps every pending run of the release-publish
# group. The ignore pattern is that version's error text.
paths:
  .github/workflows/release*.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"'
